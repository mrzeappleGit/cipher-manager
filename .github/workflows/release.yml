name: Windows beta
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft prerelease after all checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-beta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Select Rust stable
        run: rustup default stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit
      - name: Verify source and tests
        run: npm run check
      - name: Prepare clean public source and scan secrets
        shell: pwsh
        run: |
          node scripts/export-public.mjs .release-private/public-source-ci
          ./scripts/scan-secrets.ps1 -Source .release-private/public-source-ci -History
      - name: Build Windows installer
        run: npm run release
      - name: Smoke test packaged server with empty data
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -ServePath src-tauri/binaries/serve-x86_64-pc-windows-msvc.exe
      - name: Collect release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-artifacts/
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,docs/release-notes.md release-artifacts/
          tar.exe -a -cf release-artifacts/source.zip -C .release-private/public-source-ci .
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $lines = Get-ChildItem -File release-artifacts | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name }
          $lines | Set-Content -Encoding ascii release-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-beta
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-beta
          path: release-artifacts
      - name: Create draft only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(Get-ChildItem -File release-artifacts | ForEach-Object FullName)
          gh release create "v$version" @assets --target $env:RELEASE_COMMIT --draft --prerelease --title "cipherManager $version" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; nothing was published by this workflow' }
